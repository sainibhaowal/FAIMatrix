name: security

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  python-security:
    name: Python security scan
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: faim_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Dependency audit
        run: pip-audit --strict -r requirements.txt

      - name: Security linter
        run: bandit -r faim_native -ll --exclude faim_native/tests

      - name: Repo security audit
        run: bash scripts/security_audit.sh

  frontend-deps:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
