name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest -q -o addopts="" -n auto --dist loadfile --cache-clear

  backend-compile:
    name: Backend compile and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: python -m compileall -q faim_native tests scripts

      - name: Validate shell scripts
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print)

  frontend-quality:
    name: Frontend type, lint, and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  compose-validation:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      QDRANT_API_KEY: ci-qdrant-key
      NEXTAUTH_SECRET: ci-nextauth-secret
      RESEND_API_KEY: ci-resend-key
      FAIM_IMAGE_PREFIX: ghcr.io/sainibhaowal/faimatrix
      FAIM_IMAGE_TAG: ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate local Compose configuration
        run: docker compose config --quiet

      - name: Validate VPS registry Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.vps.yml -f docker-compose.registry.yml --profile accel config --quiet

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run repository security audit
        run: ./scripts/security_audit.sh
