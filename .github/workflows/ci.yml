name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///Runtime/ci-backend.db
      TEST_DATABASE_URL: sqlite:///Runtime/ci-backend.db
      TENANT_KEYS_JSON: '{"ci":["ci_key"]}'
      ADMIN_KEYS_JSON: '{"admin":"ci_admin_key"}'
      FAIM_ENV: development
      FAIM_MODE: development
      FAIM_AUTH_DB_PRIMARY: "false"
      FAIM_AUTH_ENV_FALLBACK_ENABLED: "true"
      FAIM_ENCRYPTION_AT_REST: "false"
      FAIM_ENCRYPTION_FAIL_CLOSED: "false"
      FAIM_STORAGE_CONTRACT_STRICT: "true"
      FAIM_STORAGE_OBSERVABILITY_ENABLED: "true"
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: "false"
      PYTHONPATH: faim_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    env:
      DATABASE_URL: sqlite:///Runtime/ci-e2e.db
      TEST_DATABASE_URL: sqlite:///Runtime/ci-e2e.db
      TENANT_KEYS_JSON: '{"tenant_e2e":["e2e_key"]}'
      ADMIN_KEYS_JSON: '{"admin":"e2e_admin_key"}'
      NEXTAUTH_SECRET: ci-e2e-secret-key
      FAIM_ENV: development
      FAIM_MODE: development
      FAIM_AUTH_DB_PRIMARY: "false"
      FAIM_AUTH_ENV_FALLBACK_ENABLED: "true"
      FAIM_ENCRYPTION_AT_REST: "false"
      FAIM_ENCRYPTION_FAIL_CLOSED: "false"
      FAIM_STORAGE_CONTRACT_STRICT: "true"
      FAIM_STORAGE_OBSERVABILITY_ENABLED: "true"
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: "false"
      PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BYPASS_AUTH: "true"
      PLAYWRIGHT_INCLUDE_WEBKIT: "false"
      PYTHONPATH: faim_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        run: |
          mkdir -p Runtime
          nohup python -m uvicorn api.app:app --host 127.0.0.1 --port 8000 > Runtime/ci-backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy"
          cat Runtime/ci-backend.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke
        working-directory: frontend
        run: npm run test:e2e -- e2e/fig-view-e2e.spec.ts -g "successful load renders FIG View title"
