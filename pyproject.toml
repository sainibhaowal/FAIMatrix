[tool.mypy]
python_version = "3.11"
packages = ["faim"]
ignore_missing_imports = true
strict = false
# Relax SQLAlchemy-related type checking and common patterns
disable_error_code = [
    "attr-defined",
    "arg-type",
    "return-value",
    "assignment",
    "call-arg",
    "index",
    "union-attr",
    "var-annotated",
    "misc",
    "valid-type",     # SQLAlchemy Base class issues
    "operator",       # Pydantic model operators
    "dict-item",      # Dict type mismatches
    "override",       # Signature override issues
    "call-overload",  # Overload variant issues
    "typeddict-item", # TypedDict issues
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["faim"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402", "E741", "B008", "B904"]  # Common patterns that are acceptable

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
