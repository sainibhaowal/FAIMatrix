[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# Root mypy config - points to faim_native
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["misc", "valid-type", "assignment", "arg-type", "union-attr", "var-annotated", "name-defined", "attr-defined", "call-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
