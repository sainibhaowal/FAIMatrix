# FAIM-Native Development Docker Compose
# Run with: docker compose -f docker-compose.dev.yml up --build
#
# SECURITY: All secrets must be in .env file, never hardcoded here.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: faim_native
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_native"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - faim-internal

  # Redis (Cache, Locks, Queues)
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_secret}",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - faim-internal

  # Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-qdrant_secret}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - faim-internal

  # FAIM-Native API (FastAPI with hot-reload)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: faim-api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_native
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-qdrant_secret}
      - FAIM_AUTO_MIGRATE=true
      - FAIM_LOG_LEVEL=DEBUG
      - TENANT_KEYS_JSON=${TENANT_KEYS_JSON:-{"default":["test-key"]}}
      - ADMIN_KEYS_JSON=${ADMIN_KEYS_JSON:-{"admin":"admin-key"}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
    volumes:
      # Hot-reload: mount local faim_native code into container
      - ./faim_native:/app:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - faim-internal
      - faim-external

  # Background Worker (For Durable Jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: faim-worker
    env_file: .env
    command: ["python", "-m", "orchestration.jobs.worker"]
    environment:
      - DATABASE_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_native
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - FAIM_LOG_LEVEL=DEBUG
    volumes:
      - ./faim_native:/app:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - faim-internal

  # FAIM Frontend (Next.js with hot-reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: faim-frontend
    environment:
      - API_HOST=api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - faim-internal
      - faim-external

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  faim-internal:
    internal: true
  faim-external:
    name: faim-dev
