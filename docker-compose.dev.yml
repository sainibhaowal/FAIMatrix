# FAIM Development Docker Compose
# Run with: docker compose -f docker-compose.dev.yml up --build
#
# SECURITY: All secrets must be in .env file, never hardcoded here.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: faim_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: No port exposure - only accessible within Docker network
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - faim-internal

  # Redis (Cache, Rate Limiting) - WITH PASSWORD
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    # SECURITY: No port exposure - only accessible within Docker network
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - faim-internal

  # Qdrant (Vector Database) - WITH API KEY
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY required}
    volumes:
      - qdrant_data:/qdrant/storage
    # SECURITY: No port exposure - only accessible within Docker network
    # ports:
    #   - "6333:6333"
    #   - "6334:6334"
    restart: unless-stopped
    networks:
      - faim-internal

  # FAIM Backend API (FastAPI with hot-reload)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: faim-api
    environment:
      - FAIM_MODE=production
      - FAIM_DB_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_lab
      - DATABASE_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_lab
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # Production backends (no SQLite)
      - FAIM_STORAGE_BACKEND=postgres
      - FAIM_VECTOR_BACKEND=qdrant
      - FAIM_CACHE_BACKEND=redis
      # SECURITY: All secrets from .env
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@faimatrix.com}
      # LLM Provider (Groq)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - APP_URL=${APP_URL:-http://localhost:3000}
      # SECURITY: CORS restriction
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      # Hot-reload: mount local code into container
      - ./faim:/app/faim:ro
      - ./alembic:/app/alembic:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - faim-internal
      - faim-external

  # FAIM Frontend (Next.js with hot-reload)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: faim-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_HOST=api:8000
      - API_HOST=api:8000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${JWT_SECRET:?JWT_SECRET required}
    volumes:
      # Hot-reload: mount local code into container
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - faim-internal
      - faim-external

  # Cloudflare Tunnel (Exposes app to internet securely)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: faim-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - faim-external

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  faim-internal:
    # Internal network - no external access
    internal: true
  faim-external:
    # External network - for exposed services only
    name: faim-dev
