[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faim-benchmarks"
version = "1.0.0"
description = "Standalone, reproducible external benchmark harness for FAIM vs AI memory systems (BEIR, LoCoMo, LongMemEval)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "httpx>=0.27.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
datasets = [
  "datasets>=2.18.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
faim-bench = "faim_benchmarks.cli:main"

[tool.setuptools.packages.find]
include = ["faim_benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
