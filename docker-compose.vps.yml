services:
  postgres:
    container_name: faim-postgres-vps
    ports: !reset []
    volumes:
      - ./Runtime/vps/postgres:/var/lib/postgresql/data

  redis:
    container_name: faim-redis-vps
    ports: !reset []
    volumes:
      - ./Runtime/vps/redis:/data

  qdrant:
    container_name: faim-qdrant-vps
    ports: !reset []
    volumes:
      - ./Runtime/vps/qdrant:/qdrant/storage

  migrate:
    env_file:
      - deploy/env.vpsprod
    container_name: faim-migrate-vps
    volumes:
      - ./Runtime/vps/raw:/var/lib/faim/raw
      - ./Runtime/vps/backups:/var/lib/faim/backups

  api:
    env_file:
      - deploy/env.vpsprod
    container_name: faim-api-vps
    ports: !reset []
    environment:
      FAIM_MODE: production
      FAIM_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY required}
      FAIM_BACKUP_DIR: /var/lib/faim/backups
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_PUBLIC_ORIGIN: ${FAIM_PUBLIC_ORIGIN:-https://faimatrix.com}
      FAIM_CORS_ALLOW_ORIGINS: ${FAIM_CORS_ALLOW_ORIGINS:-https://faimatrix.com}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://faimatrix.com}
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-true}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-true}
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-false}
    volumes:
      - ./Runtime/vps/raw:/var/lib/faim/raw
      - ./Runtime/vps/backups:/var/lib/faim/backups

  worker:
    env_file:
      - deploy/env.vpsprod
    container_name: faim-worker-vps
    ports: !reset []
    environment:
      FAIM_MODE: production
      FAIM_ENV: production
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-true}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-true}
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-false}
    volumes:
      - ./Runtime/vps/raw:/var/lib/faim/raw

  frontend:
    env_file:
      - deploy/env.vpsprod
    container_name: faim-frontend-vps
    ports: !reset []
    build:
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://faimatrix.com}
        API_HOST: faim-api-vps:8000
    environment:
      API_HOST: faim-api-vps:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://faimatrix.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}

  caddy:
    image: caddy:2-alpine
    container_name: faim-caddy-vps
    # The independent gateway is the only public TLS endpoint.  This Caddy
    # instance is reachable exclusively through the shared external Docker
    # network; it publishes no host ports.
    volumes:
      - ./deploy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - ./Runtime/vps/caddy_data:/data
      - ./Runtime/vps/caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [faim-net, gateway-net]
    restart: unless-stopped

networks:
  gateway-net:
    # `independent-gateway-caddy` already belongs to this VPS network.  Only
    # the FAIM proxy joins it, keeping API, worker, and data services private.
    external: true
    name: aurelinx_default
