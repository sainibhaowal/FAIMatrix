services:
  postgres:
    ports: !reset []
    volumes:
      - ./Runtime/localprod/postgres:/var/lib/postgresql/data

  redis:
    ports: !reset []
    volumes:
      - ./Runtime/localprod/redis:/data

  qdrant:
    ports: !reset []
    volumes:
      - ./Runtime/localprod/qdrant:/qdrant/storage

  migrate:
    volumes:
      - ./Runtime/localprod/raw:/var/lib/faim/raw
      - ./Runtime/localprod/backups:/var/lib/faim/backups

  api:
    ports: !reset []
    environment:
      FAIM_MODE: production
      FAIM_ENV: production
      FAIM_ADMIN_KEY: ${FAIM_ADMIN_KEY:?FAIM_ADMIN_KEY required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY required}
      FAIM_BACKUP_DIR: /var/lib/faim/backups
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_PUBLIC_ORIGIN: ${FAIM_PUBLIC_ORIGIN:-https://faimatrix.localhost:8443}
      FAIM_CORS_ALLOW_ORIGINS: ${FAIM_CORS_ALLOW_ORIGINS:-https://faimatrix.localhost:8443}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://faimatrix.localhost:8443}
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-true}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-true}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}
    volumes:
      - ./Runtime/localprod/raw:/var/lib/faim/raw
      - ./Runtime/localprod/backups:/var/lib/faim/backups

  worker:
    ports: !reset []
    environment:
      FAIM_MODE: production
      FAIM_ENV: production
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-true}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-true}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}
    volumes:
      - ./Runtime/localprod/raw:/var/lib/faim/raw

  frontend:
    ports: !reset []
    build:
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://faimatrix.localhost:8443}
        API_HOST: faim-api:8000
    environment:
      API_HOST: faim-api:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://faimatrix.localhost:8443}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      FAIM_ADMIN_KEY: ${FAIM_ADMIN_KEY:?FAIM_ADMIN_KEY required}
      FAIM_ADMIN_EMAILS_JSON: ${FAIM_ADMIN_EMAILS_JSON:-[]}

  caddy:
    image: caddy:2-alpine
    container_name: faim-caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile.localprod:/etc/caddy/Caddyfile:ro
      - ./Runtime/localprod/certs:/data/certs
      - ./Runtime/localprod/caddy_data:/data
      - ./Runtime/localprod/caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [faim-net]
    restart: unless-stopped
