# Optional NVIDIA GPU override for hosts with nvidia-container-toolkit installed.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# When CUDA is available inside the container, FAIM_EMBEDDING_DEVICE=auto and
# FAIM_USE_GPU_BACKEND=auto automatically use GPU end-to-end and fall back to
# CPU if CUDA becomes unavailable.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    environment:
      FAIM_EMBEDDING_DEVICE: ${FAIM_EMBEDDING_DEVICE:-auto}
      FAIM_USE_GPU_BACKEND: ${FAIM_USE_GPU_BACKEND:-auto}
      FAIM_FAST_ML_EMBEDDING: ${FAIM_FAST_ML_EMBEDDING:-false}
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    environment:
      FAIM_EMBEDDING_DEVICE: ${FAIM_EMBEDDING_DEVICE:-auto}
      FAIM_USE_GPU_BACKEND: ${FAIM_USE_GPU_BACKEND:-auto}
      FAIM_FAST_ML_EMBEDDING: ${FAIM_FAST_ML_EMBEDDING:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-evolve:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    environment:
      FAIM_EMBEDDING_DEVICE: ${FAIM_EMBEDDING_DEVICE:-auto}
      FAIM_USE_GPU_BACKEND: ${FAIM_USE_GPU_BACKEND:-auto}
      FAIM_FAST_ML_EMBEDDING: ${FAIM_FAST_ML_EMBEDDING:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
