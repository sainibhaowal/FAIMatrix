services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (Required - Canonical Source of Truth)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: faim_native
    ports:
      - "8020:8020"
    command:
      [
        "postgres",
        "-p",
        "8020",
        "-c",
        "max_connections=300",
        "-c",
        "shared_buffers=1GB",
        "-c",
        "effective_cache_size=4GB",
        "-c",
        "work_mem=16MB",
        "-c",
        "maintenance_work_mem=256MB",
        "-c",
        "wal_buffers=16MB",
        "-c",
        "max_wal_size=4GB",
        "-c",
        "checkpoint_timeout=15min",
      ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_native -p 8020"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (Optional Acceleration & Locks)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    ports:
      - "8030:8030"
    command:
      [
        "redis-server",
        "--port",
        "8030",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD required}",
        "--stop-writes-on-bgsave-error",
        "no",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8030", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant (Vector Acceleration Engine)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    ports:
      - "8040:8040"
      - "8050:8050"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
      QDRANT__SERVICE__HTTP_PORT: 8040
      QDRANT__SERVICE__GRPC_PORT: 8050
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8040' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-Shot Migration Job (Operator runs explicitly)
  # ---------------------------------------------------------------------------
  migrate:
    image: ${FAIM_MIGRATE_IMAGE:-faim-migrate:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: faim-migrate
    entrypoint: ["python"]
    command: ["-m", "store.pg.migrate", "up"]
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      FAIM_AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [faim-net]
    restart: "no"

  # ---------------------------------------------------------------------------
  # FAIM-Native API
  # ---------------------------------------------------------------------------
  api:
    image: ${FAIM_API_IMAGE:-faim-api:latest}
    runtime: ${FAIM_CONTAINER_RUNTIME:-runc}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: faim-api
    command:
      [
        "gunicorn",
        "api.app:app",
        "--workers",
        "${FAIM_API_WORKERS:-6}",
        "--worker-class",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8000",
        "--timeout",
        "${FAIM_API_TIMEOUT:-120}",
        "--graceful-timeout",
        "${FAIM_API_GRACEFUL_TIMEOUT:-30}",
        "--keep-alive",
        "5",
      ]
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      FAIM_BACKUP_DIR: ${FAIM_BACKUP_DIR:-/var/lib/faim/backups}
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_MODE: ${FAIM_MODE:-production}
      FAIM_ENV: ${FAIM_ENV:-production}
      FAIM_LOG_LEVEL: ${FAIM_LOG_LEVEL:-INFO}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_MASTER_KEY: ${FAIM_MASTER_KEY:-}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${FAIM_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-300000}
      FAIM_DB_LOCK_TIMEOUT_MS: ${FAIM_DB_LOCK_TIMEOUT_MS:-120000}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_ALLOW_DEV_AUTH_BYPASS: ${FAIM_ALLOW_DEV_AUTH_BYPASS:-false}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_PUBLIC_ORIGIN: ${FAIM_PUBLIC_ORIGIN:-http://localhost:8010}
      FAIM_CORS_ALLOW_ORIGINS: ${FAIM_CORS_ALLOW_ORIGINS:-http://localhost:8010}
      FAIM_CSP_CONNECT_SRC: ${FAIM_CSP_CONNECT_SRC:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8010}
      FAIM_AUTO_MIGRATE: ${FAIM_AUTO_MIGRATE:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@faimatrix.com}
      TENANT_KEYS_JSON: ${TENANT_KEYS_JSON:-{}}
      ADMIN_KEYS_JSON: ${ADMIN_KEYS_JSON:-{}}
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-false}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-false}
      FAIM_OCR_ENABLED: ${FAIM_OCR_ENABLED:-true}
      FAIM_OCR_ENGINE: ${FAIM_OCR_ENGINE:-paddleocr_v6}
      FAIM_OCR_FAIL_CLOSED: ${FAIM_OCR_FAIL_CLOSED:-false}
      FAIM_OCR_LANGS: ${FAIM_OCR_LANGS:-eng}
      FAIM_EMBEDDING_DEVICE: ${FAIM_EMBEDDING_DEVICE:-cpu}
      FAIM_USE_GPU_BACKEND: ${FAIM_USE_GPU_BACKEND:-auto}
      FAIM_FAST_ML_EMBEDDING: ${FAIM_FAST_ML_EMBEDDING:-auto}
      FAIM_CPU_THREADS: ${FAIM_CPU_THREADS:-2}
      FAIM_EMBEDDING_CPU_BATCH_SIZE: ${FAIM_EMBEDDING_CPU_BATCH_SIZE:-32}
      FAIM_MIN_CUDA_FREE_MIB: ${FAIM_MIN_CUDA_FREE_MIB:-1024}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-void}
      FAIM_EMBEDDING_PREWARM: ${FAIM_EMBEDDING_PREWARM:-true}
      FAIM_EMBEDDING_PREWARM_TIMEOUT_SECONDS: ${FAIM_EMBEDDING_PREWARM_TIMEOUT_SECONDS:-300}
      FAIM_EMBEDDING_PREWARM_REQUIRED: ${FAIM_EMBEDDING_PREWARM_REQUIRED:-true}
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_BENCHMARK_MODE: ${FAIM_BENCHMARK_MODE:-false}
      FAIM_CHUNKING_ENABLED: ${FAIM_CHUNKING_ENABLED:-false}
      FAIM_CHUNK_MAX_CHARS: ${FAIM_CHUNK_MAX_CHARS:-1200}
      FAIM_CHUNK_OVERLAP: ${FAIM_CHUNK_OVERLAP:-120}
      FAIM_JOB_MAX_RETRIES: ${FAIM_JOB_MAX_RETRIES:-1}
      FAIM_DOMAIN_AUTONOMY_ENABLED: ${FAIM_DOMAIN_AUTONOMY_ENABLED:-true}
      FAIM_RATE_LIMITS_JSON: '${FAIM_RATE_LIMITS_JSON:-{}}'
      FAIM_EVENT_PAYLOAD_MAX_BYTES: ${FAIM_EVENT_PAYLOAD_MAX_BYTES:-4096}
      FAIM_EXPLAIN_MAX_ITEMS: ${FAIM_EXPLAIN_MAX_ITEMS:-25}
      FAIM_LOCK_DIR: ${FAIM_LOCK_DIR:-/tmp/faim/locks}
      FAIM_REPR_V2_ENABLED: ${FAIM_REPR_V2_ENABLED:-true}
      FAIM_PHASE5_ENABLED: ${FAIM_PHASE5_ENABLED:-true}
      FAIM_PHASE5_DENSE_SQL_MAX_NODES: ${FAIM_PHASE5_DENSE_SQL_MAX_NODES:-2000}
      FAIM_FAST_RELEVANCE_FIRST: ${FAIM_FAST_RELEVANCE_FIRST:-true}
      FAIM_FAST_GRAPH_EXPANSION: ${FAIM_FAST_GRAPH_EXPANSION:-false}
      FAIM_FAST_IDF: ${FAIM_FAST_IDF:-false}
      FAIM_SELF_EVOLVE_ENABLED: ${FAIM_SELF_EVOLVE_ENABLED:-true}
      FAIM_SELF_EVOLVE_TRIGGER_MODE: ${FAIM_SELF_EVOLVE_TRIGGER_MODE:-hybrid}
      FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS:-60}
      FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS:-30}
      FAIM_SELF_EVOLVE_MIN_VERSION_DELTA: ${FAIM_SELF_EVOLVE_MIN_VERSION_DELTA:-1}
      FAIM_SELF_EVOLVE_MAX_ACTIONS: ${FAIM_SELF_EVOLVE_MAX_ACTIONS:-25}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-true}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-true}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-2}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.2}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}
      REDIS_URL: ${REDIS_URL:-redis://:faim_pass@redis:8030/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:8040}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - raw_data:/var/lib/faim/raw
      - backups_data:/var/lib/faim/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://localhost:8000/ready",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Background Workers (Isolated Ingest & Self-Evolve Pools)
  # ---------------------------------------------------------------------------
  worker-ingest:
    image: ${FAIM_WORKER_IMAGE:-faim-worker:latest}
    runtime: ${FAIM_CONTAINER_RUNTIME:-runc}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: ["python", "-m", "orchestration.jobs.worker"]
    restart: unless-stopped
    deploy:
      replicas: ${FAIM_INGEST_WORKERS:-8}
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      REDIS_URL: ${REDIS_URL:-redis://:faim_pass@redis:8030/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:8040}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_MODE: ${FAIM_MODE:-production}
      FAIM_ENV: ${FAIM_ENV:-production}
      FAIM_LOG_LEVEL: ${FAIM_LOG_LEVEL:-INFO}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_MASTER_KEY: ${FAIM_MASTER_KEY:-}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${FAIM_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-300000}
      FAIM_DB_LOCK_TIMEOUT_MS: ${FAIM_DB_LOCK_TIMEOUT_MS:-120000}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_EVENT_PAYLOAD_MAX_BYTES: ${FAIM_EVENT_PAYLOAD_MAX_BYTES:-4096}
      FAIM_LOCK_DIR: ${FAIM_LOCK_DIR:-/tmp/faim/locks}
      FAIM_PUBLIC_ORIGIN: ${FAIM_PUBLIC_ORIGIN:-http://localhost:8010}
      FAIM_CORS_ALLOW_ORIGINS: ${FAIM_CORS_ALLOW_ORIGINS:-http://localhost:8010}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8010}
      FAIM_AUTO_MIGRATE: "false"
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_BENCHMARK_MODE: ${FAIM_BENCHMARK_MODE:-false}
      FAIM_WORKER_JOB_KINDS: ${FAIM_INGEST_WORKER_JOB_KINDS:-storage_upload,ingest_secondary_index,crypto_rotation,storage_retention,raw_reencryption}
      FAIM_WORKER_SELF_EVOLVE_SCAN_ENABLED: "false"
      FAIM_EMBEDDING_DEVICE: ${FAIM_EMBEDDING_DEVICE:-cpu}
      FAIM_USE_GPU_BACKEND: ${FAIM_USE_GPU_BACKEND:-auto}
      FAIM_FAST_ML_EMBEDDING: ${FAIM_FAST_ML_EMBEDDING:-auto}
      FAIM_CPU_THREADS: ${FAIM_CPU_THREADS:-2}
      FAIM_EMBEDDING_CPU_BATCH_SIZE: ${FAIM_EMBEDDING_CPU_BATCH_SIZE:-32}
      FAIM_MIN_CUDA_FREE_MIB: ${FAIM_MIN_CUDA_FREE_MIB:-1024}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-void}
      FAIM_CHUNKING_ENABLED: ${FAIM_CHUNKING_ENABLED:-false}
      FAIM_CHUNK_MAX_CHARS: ${FAIM_CHUNK_MAX_CHARS:-1200}
      FAIM_CHUNK_OVERLAP: ${FAIM_CHUNK_OVERLAP:-120}
      FAIM_JOB_MAX_RETRIES: ${FAIM_JOB_MAX_RETRIES:-1}
      FAIM_DOMAIN_AUTONOMY_ENABLED: ${FAIM_DOMAIN_AUTONOMY_ENABLED:-true}
      FAIM_REPR_V2_ENABLED: ${FAIM_REPR_V2_ENABLED:-true}
      FAIM_PHASE5_ENABLED: ${FAIM_PHASE5_ENABLED:-true}
      FAIM_PHASE5_DENSE_SQL_MAX_NODES: ${FAIM_PHASE5_DENSE_SQL_MAX_NODES:-2000}
      FAIM_FAST_RELEVANCE_FIRST: ${FAIM_FAST_RELEVANCE_FIRST:-true}
      FAIM_FAST_GRAPH_EXPANSION: ${FAIM_FAST_GRAPH_EXPANSION:-false}
      FAIM_FAST_IDF: ${FAIM_FAST_IDF:-false}
      FAIM_OCR_ENABLED: ${FAIM_OCR_ENABLED:-true}
      FAIM_OCR_ENGINE: ${FAIM_OCR_ENGINE:-paddleocr_v6}
      FAIM_OCR_FAIL_CLOSED: ${FAIM_OCR_FAIL_CLOSED:-false}
      FAIM_OCR_LANGS: ${FAIM_OCR_LANGS:-eng}
      FAIM_SELF_EVOLVE_ENABLED: ${FAIM_SELF_EVOLVE_ENABLED:-true}
      FAIM_SELF_EVOLVE_TRIGGER_MODE: ${FAIM_SELF_EVOLVE_TRIGGER_MODE:-hybrid}
      FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS:-60}
      FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS:-30}
      FAIM_SELF_EVOLVE_MIN_VERSION_DELTA: ${FAIM_SELF_EVOLVE_MIN_VERSION_DELTA:-1}
      FAIM_SELF_EVOLVE_MAX_ACTIONS: ${FAIM_SELF_EVOLVE_MAX_ACTIONS:-25}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-true}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-true}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-2}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.2}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}
    volumes:
      - raw_data:/var/lib/faim/raw
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import orchestration.jobs.worker; import store.pg.session; print("worker_ok")'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [faim-net]

  worker-evolve:
    image: ${FAIM_WORKER_IMAGE:-faim-worker:latest}
    runtime: ${FAIM_CONTAINER_RUNTIME:-runc}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: faim-worker-evolve
    command: ["python", "-m", "orchestration.jobs.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      REDIS_URL: ${REDIS_URL:-redis://:faim_pass@redis:8030/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:8040}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_MODE: ${FAIM_MODE:-production}
      FAIM_ENV: ${FAIM_ENV:-production}
      FAIM_LOG_LEVEL: ${FAIM_LOG_LEVEL:-INFO}
      FAIM_ENCRYPTION_AT_REST: ${FAIM_ENCRYPTION_AT_REST:-true}
      FAIM_ENCRYPTION_FAIL_CLOSED: ${FAIM_ENCRYPTION_FAIL_CLOSED:-true}
      FAIM_MASTER_KEY: ${FAIM_MASTER_KEY:-}
      FAIM_AUTH_DB_PRIMARY: ${FAIM_AUTH_DB_PRIMARY:-true}
      FAIM_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${FAIM_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-300000}
      FAIM_DB_LOCK_TIMEOUT_MS: ${FAIM_DB_LOCK_TIMEOUT_MS:-120000}
      FAIM_AUTH_ENV_FALLBACK_ENABLED: ${FAIM_AUTH_ENV_FALLBACK_ENABLED:-false}
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: ${FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED:-true}
      FAIM_STORAGE_CONTRACT_STRICT: ${FAIM_STORAGE_CONTRACT_STRICT:-true}
      FAIM_STORAGE_OBSERVABILITY_ENABLED: ${FAIM_STORAGE_OBSERVABILITY_ENABLED:-true}
      FAIM_EVENT_PAYLOAD_MAX_BYTES: ${FAIM_EVENT_PAYLOAD_MAX_BYTES:-4096}
      FAIM_LOCK_DIR: ${FAIM_LOCK_DIR:-/tmp/faim/locks}
      FAIM_PUBLIC_ORIGIN: ${FAIM_PUBLIC_ORIGIN:-http://localhost:8010}
      FAIM_CORS_ALLOW_ORIGINS: ${FAIM_CORS_ALLOW_ORIGINS:-http://localhost:8010}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8010}
      FAIM_AUTO_MIGRATE: "false"
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_BENCHMARK_MODE: ${FAIM_BENCHMARK_MODE:-false}
      FAIM_WORKER_JOB_KINDS: ${FAIM_EVOLVE_WORKER_JOB_KINDS:-evolve,domain_autonomy}
      FAIM_WORKER_SELF_EVOLVE_SCAN_ENABLED: "true"
      FAIM_EMBEDDING_DEVICE: ${FAIM_EMBEDDING_DEVICE:-cpu}
      FAIM_USE_GPU_BACKEND: ${FAIM_USE_GPU_BACKEND:-auto}
      FAIM_FAST_ML_EMBEDDING: ${FAIM_FAST_ML_EMBEDDING:-auto}
      FAIM_CPU_THREADS: ${FAIM_CPU_THREADS:-2}
      FAIM_EMBEDDING_CPU_BATCH_SIZE: ${FAIM_EMBEDDING_CPU_BATCH_SIZE:-32}
      FAIM_MIN_CUDA_FREE_MIB: ${FAIM_MIN_CUDA_FREE_MIB:-1024}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-void}
      FAIM_JOB_MAX_RETRIES: ${FAIM_JOB_MAX_RETRIES:-1}
      FAIM_DOMAIN_AUTONOMY_ENABLED: ${FAIM_DOMAIN_AUTONOMY_ENABLED:-true}
      FAIM_REPR_V2_ENABLED: ${FAIM_REPR_V2_ENABLED:-true}
      FAIM_PHASE5_ENABLED: ${FAIM_PHASE5_ENABLED:-true}
      FAIM_PHASE5_DENSE_SQL_MAX_NODES: ${FAIM_PHASE5_DENSE_SQL_MAX_NODES:-2000}
      FAIM_SELF_EVOLVE_ENABLED: ${FAIM_SELF_EVOLVE_ENABLED:-true}
      FAIM_SELF_EVOLVE_TRIGGER_MODE: ${FAIM_SELF_EVOLVE_TRIGGER_MODE:-hybrid}
      FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS:-60}
      FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS:-30}
      FAIM_SELF_EVOLVE_MIN_VERSION_DELTA: ${FAIM_SELF_EVOLVE_MIN_VERSION_DELTA:-1}
      FAIM_SELF_EVOLVE_MAX_ACTIONS: ${FAIM_SELF_EVOLVE_MAX_ACTIONS:-25}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-true}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-true}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-2}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.2}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}
    volumes:
      - raw_data:/var/lib/faim/raw
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import orchestration.jobs.worker; import store.pg.session; print("worker_ok")'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [faim-net]

  # ---------------------------------------------------------------------------
  # FAIM Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    image: ${FAIM_FRONTEND_IMAGE:-faim-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_HOST=faim-api:8000
        - NEXT_PUBLIC_APP_VERSION=${FAIM_APP_VERSION:-0.10.0}
    container_name: faim-frontend
    ports:
      - "8010:8010"
    environment:
      - API_HOST=faim-api:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8010}
      - FAIM_ADMIN_EMAIL=${FAIM_ADMIN_EMAIL:-}
      - FAIM_ADMIN_EMAILS_JSON=${FAIM_ADMIN_EMAILS_JSON:-[]}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional VPS Reverse Proxy (--profile vps)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: faim-caddy
    profiles: ["vps"]
    volumes:
      - ./deploy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [faim-net, gateway-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Isolated CI / E2E Test Stack (--profile test)
  # ---------------------------------------------------------------------------
  postgres-test:
    image: pgvector/pgvector:pg15
    container_name: faim-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: faim_test_password
      POSTGRES_DB: faim_native
    ports:
      - "8021:8020"
    command: ["postgres", "-p", "8020"]
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_native -p 8020"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-test-net]
    restart: unless-stopped

  redis-test:
    image: redis:7-alpine
    container_name: faim-redis-test
    profiles: ["test"]
    ports:
      - "8031:8030"
    command:
      [
        "redis-server",
        "--port",
        "8030",
        "--appendonly",
        "yes",
        "--requirepass",
        "faim_test_password",
        "--stop-writes-on-bgsave-error",
        "no",
      ]
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8030", "-a", "faim_test_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-test-net]
    restart: unless-stopped

  qdrant-test:
    image: qdrant/qdrant:v1.14.1
    container_name: faim-qdrant-test
    profiles: ["test"]
    ports:
      - "8041:6333"
    volumes:
      - qdrant_test_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [faim-test-net]
    restart: unless-stopped

  api-test:
    image: faim-api-test:latest
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-api-test
    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      DATABASE_URL: postgresql://faim:faim_test_password@postgres-test:8020/faim_native
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_AUTO_MIGRATE: "true"
      FAIM_AUTH_DB_PRIMARY: "true"
      FAIM_AUTH_ENV_FALLBACK_ENABLED: "false"
      FAIM_AUTH_SCOPE_ENFORCEMENT_ENABLED: "true"
      NEXTAUTH_SECRET: playwright-e2e-secret
      REDIS_URL: redis://:faim_test_password@redis-test:8030/0
      FAIM_ENABLE_INDEX: "true"
      FAIM_FAST_ML_EMBEDDING: "false"
      FAIM_EMBEDDING_DEVICE: "cpu"
      FAIM_BENCHMARK_MODE: "true"
      FAIM_SELF_EVOLVE_ENABLED: "false"
      QDRANT_URL: http://qdrant-test:6333
    volumes:
      - raw_test_data:/var/lib/faim/raw
    ports:
      - "8001:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/ready | grep -q 'status'",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
    networks: [faim-test-net]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  raw_data:
  backups_data:
  caddy_data:
  caddy_config:
  postgres_test_data:
  redis_test_data:
  raw_test_data:
  qdrant_test_data:

networks:
  faim-net:
    driver: bridge
  faim-test-net:
    driver: bridge
  gateway-net:
    external: true
    name: ${FAIM_GATEWAY_NETWORK:-faim-gateway-net}
