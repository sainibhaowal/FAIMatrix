services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (Required - Source of Truth)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: faim_native
    ports:
      - "8020:8020"
    command: ["postgres", "-p", "8020"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_native -p 8020"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (Optional - Acceleration Only)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    ports:
      - "8030:8030"
    command:
      [
        "redis-server",
        "--port",
        "8030",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD required}",
        "--stop-writes-on-bgsave-error",
        "no",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8030", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant (Vector Acceleration Engine)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    ports:
      - "8040:8040"
      - "8050:8050"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
      QDRANT__SERVICE__HTTP_PORT: 8040
      QDRANT__SERVICE__GRPC_PORT: 8050
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8040' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-Shot Migration Job (Operator runs explicitly)
  # ---------------------------------------------------------------------------
  migrate:
    image: faim-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-migrate
    entrypoint: ["python"]
    command: ["-m", "store.pg.migrate", "up"]
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      FAIM_AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [faim-net]
    restart: "no"

  # ---------------------------------------------------------------------------
  # FAIM-Native API
  # ---------------------------------------------------------------------------
  api:
    image: faim-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-api
    # Keep the API responsive while a synchronous graph/storage operation is
    # running.  The image ships gunicorn and this is the production command;
    # the previous single uvicorn worker allowed one blocked request to stall
    # liveness, readiness, and every user request in the container.
    command:
      [
        "gunicorn",
        "api.app:app",
        "--workers",
        "4",
        "--worker-class",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8000",
        "--timeout",
        "120",
        "--graceful-timeout",
        "30",
        "--keep-alive",
        "5",
      ]
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs

      # IMPORTANT: Production default is FALSE (safer)
      FAIM_AUTO_MIGRATE: ${FAIM_AUTO_MIGRATE:-false}

      # Authentication
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TENANT_KEYS_JSON: ${TENANT_KEYS_JSON:-{}}
      ADMIN_KEYS_JSON: ${ADMIN_KEYS_JSON:-{}}

      # Acceleration (enabled only with --profile accel)
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-false}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-false}
      FAIM_OCR_ENABLED: ${FAIM_OCR_ENABLED:-true}
      FAIM_OCR_ENGINE: ${FAIM_OCR_ENGINE:-paddleocr_v6}
      FAIM_OCR_FAIL_CLOSED: ${FAIM_OCR_FAIL_CLOSED:-false}

      FAIM_OCR_LANGS: ${FAIM_OCR_LANGS:-eng}
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_SELF_EVOLVE_ENABLED: ${FAIM_SELF_EVOLVE_ENABLED:-true}
      FAIM_SELF_EVOLVE_TRIGGER_MODE: ${FAIM_SELF_EVOLVE_TRIGGER_MODE:-hybrid}
      FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS:-60}
      FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS:-30}
      FAIM_SELF_EVOLVE_MIN_VERSION_DELTA: ${FAIM_SELF_EVOLVE_MIN_VERSION_DELTA:-1}
      FAIM_SELF_EVOLVE_MAX_ACTIONS: ${FAIM_SELF_EVOLVE_MAX_ACTIONS:-25}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-true}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-true}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-2}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.2}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}
      REDIS_URL: ${REDIS_URL:-redis://:faim_pass@redis:8030/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:8040}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

    volumes:
      - raw_data:/var/lib/faim/raw
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://localhost:8000/ready",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
    # Stage-11: Container Hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Background Worker (Durable Jobs)
  # ---------------------------------------------------------------------------
  worker:
    image: faim-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-worker
    command: ["python", "-m", "orchestration.jobs.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      REDIS_URL: ${REDIS_URL:-redis://:faim_pass@redis:8030/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:8040}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      FAIM_RAW_STORE_PATH: /var/lib/faim/raw/blobs
      FAIM_AUTO_MIGRATE: "false"
      FAIM_ENABLE_JOBS: ${FAIM_ENABLE_JOBS:-true}
      FAIM_OCR_ENABLED: ${FAIM_OCR_ENABLED:-true}
      FAIM_OCR_ENGINE: ${FAIM_OCR_ENGINE:-paddleocr_v6}
      FAIM_OCR_FAIL_CLOSED: ${FAIM_OCR_FAIL_CLOSED:-false}
      FAIM_OCR_LANGS: ${FAIM_OCR_LANGS:-eng}
      FAIM_SELF_EVOLVE_ENABLED: ${FAIM_SELF_EVOLVE_ENABLED:-true}
      FAIM_SELF_EVOLVE_TRIGGER_MODE: ${FAIM_SELF_EVOLVE_TRIGGER_MODE:-hybrid}
      FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_MIN_INTERVAL_SECONDS:-60}
      FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS: ${FAIM_SELF_EVOLVE_SCAN_INTERVAL_SECONDS:-30}
      FAIM_SELF_EVOLVE_MIN_VERSION_DELTA: ${FAIM_SELF_EVOLVE_MIN_VERSION_DELTA:-1}
      FAIM_SELF_EVOLVE_MAX_ACTIONS: ${FAIM_SELF_EVOLVE_MAX_ACTIONS:-25}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-true}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-true}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-2}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.2}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
      FAIM_PROFILE_PERSIST_COMPAT_MODE: ${FAIM_PROFILE_PERSIST_COMPAT_MODE:-true}

    volumes:
      - raw_data:/var/lib/faim/raw
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import orchestration.jobs.worker; import store.pg.session; print("worker_ok")'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [faim-net]
  # ---------------------------------------------------------------------------
  # FAIM Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    image: faim-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_HOST=faim-api:8000
    container_name: faim-frontend
    ports:
      - "8010:8010"
    environment:
      - API_HOST=faim-api:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://faimatrix.localhost:8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [faim-net]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  raw_data:

networks:
  faim-net:
    driver: bridge
