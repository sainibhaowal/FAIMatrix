# FAIM Lab - Production Docker Compose
# Run with: docker compose up -d

version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faim_prod_secret}
      POSTGRES_DB: faim_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Rate limiting, Celery broker, sessions)
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
  # Keycloak (Identity & Access Management)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: faim-keycloak
    command: start-dev # Use 'start' for production with proper DB
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # FAIM Backend API (FastAPI)
  faim-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: faim-api
    environment:
      - FAIM_MODE=production
      - FAIM_DB_URL=postgresql://faim:${POSTGRES_PASSWORD:-faim_prod_secret}@postgres:5432/faim_lab
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      # Backend configuration
      - FAIM_STORAGE_BACKEND=postgres
      - FAIM_VECTOR_BACKEND=qdrant
      - FAIM_CACHE_BACKEND=redis

      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/faim
      - KEYCLOAK_CLIENT_ID=faim-lab
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FAIM Frontend (Next.js)
  faim-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faim-web
    environment:
      - NEXT_PUBLIC_API_URL=http://faim-api:8000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_ID=faim-lab
      - KEYCLOAK_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/faim
    ports:
      - "3000:3000"
    depends_on:
      - faim-api
      - keycloak
    restart: unless-stopped

  # Celery Worker (Background tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: faim-worker
    command: celery -A faim.workers.celery_app worker --loglevel=info
    environment:
      - FAIM_MODE=production
      - FAIM_DB_URL=postgresql://faim:${POSTGRES_PASSWORD:-faim_prod_secret}@postgres:5432/faim_lab
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Celery Beat (Scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: faim-beat
    command: celery -A faim.workers.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Nginx (Reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: faim-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - faim-web
      - faim-api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  default:
    name: faim-network
