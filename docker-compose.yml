# FAIM Lab - Production Docker Compose (SECURED)
# Run with: docker compose up -d
#
# SECURITY: All secrets MUST be in .env file. This file contains NO secrets.

version: "3.8"

services:
  # PostgreSQL Database - INTERNAL ONLY
  postgres:
    image: postgres:15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: faim_lab
      # SECURITY: Disable external connections
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: NO port exposure - internal network only
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faim-internal

  # Redis - WITH PASSWORD, INTERNAL ONLY
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # SECURITY: NO port exposure
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faim-internal

  # Qdrant - WITH API KEY, INTERNAL ONLY
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY required}
      - QDRANT__SERVICE__ENABLE_TLS=false
    volumes:
      - qdrant_data:/qdrant/storage
    # SECURITY: NO port exposure
    restart: unless-stopped
    networks:
      - faim-internal

  # FAIM Backend API (FastAPI)
  faim-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: faim-api
    environment:
      - FAIM_MODE=production
      - FAIM_DB_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_lab
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # Backend configuration
      - FAIM_STORAGE_BACKEND=postgres
      - FAIM_VECTOR_BACKEND=qdrant
      - FAIM_CACHE_BACKEND=redis
      # SECURITY: All secrets from environment
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required - min 32 chars}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # SECURITY: CORS whitelist
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required}
      # SECURITY: Rate limiting
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_USER=100/minute
      - RATE_LIMIT_API_KEY=1000/minute
    # SECURITY: NO direct port exposure - nginx handles traffic
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - faim-internal
      - faim-external

  # FAIM Frontend (Next.js)
  faim-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faim-web
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_URL:?PUBLIC_URL required}/api
      - NEXTAUTH_URL=${PUBLIC_URL}
      - NEXTAUTH_SECRET=${JWT_SECRET}
      - API_HOST=faim-api:8000
    # SECURITY: NO direct port exposure - nginx handles traffic
    expose:
      - "3000"
    depends_on:
      - faim-api
    restart: unless-stopped
    networks:
      - faim-internal
      - faim-external


  # Nginx (Reverse proxy with HTTPS)
  nginx:
    image: nginx:alpine
    container_name: faim-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    ports:
      # SECURITY: Only 80 (redirect) and 443 (HTTPS) exposed
      - "80:80"
      - "443:443"
    depends_on:
      - faim-web
      - faim-api
    restart: unless-stopped
    networks:
      - faim-external

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  faim-internal:
    # SECURITY: Internal network - no external access possible
    internal: true
  faim-external:
    name: faim-network
