services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (Required - Source of Truth)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: faim_native
    ports:
      - "8020:8020"
    command: ["postgres", "-p", "8020"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_native -p 8020"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (Optional - Acceleration Only)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    ports:
      - "8030:8030"
    command:
      [
        "redis-server",
        "--port",
        "8030",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD required}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8030", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant (Optional - Acceleration Only)
  # ---------------------------------------------------------------------------
  qdrant:
    profiles: ["accel"]
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    ports:
      - "8040:8040"
      - "8050:8050"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
      QDRANT__SERVICE__HTTP_PORT: 8040
      QDRANT__SERVICE__GRPC_PORT: 8050
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8040' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-Shot Migration Job (Operator runs explicitly)
  # ---------------------------------------------------------------------------
  migrate:
    image: faim-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-migrate
    command: ["python", "-m", "store.pg.migrate", "up"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [faim-net]
    restart: "no"

  # ---------------------------------------------------------------------------
  # FAIM-Native API
  # ---------------------------------------------------------------------------
  api:
    image: faim-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-api
    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native

      # IMPORTANT: Production default is FALSE (safer)
      FAIM_AUTO_MIGRATE: ${FAIM_AUTO_MIGRATE:-false}

      # Acceleration (enabled only with --profile accel)
      FAIM_ENABLE_CACHE: ${FAIM_ENABLE_CACHE:-false}
      FAIM_ENABLE_INDEX: ${FAIM_ENABLE_INDEX:-false}
      FAIM_OCR_ENABLED: ${FAIM_OCR_ENABLED:-false}
      FAIM_OCR_ENGINE: ${FAIM_OCR_ENGINE:-tesseract}
      FAIM_OCR_FAIL_CLOSED: ${FAIM_OCR_FAIL_CLOSED:-false}
      FAIM_OCR_LANGS: ${FAIM_OCR_LANGS:-eng}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-false}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-false}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-3}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.3}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
      REDIS_URL: ${REDIS_URL:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/ready | grep -q 'status'",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
    # Stage-11: Container Hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks: [faim-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Background Worker (Durable Jobs)
  # ---------------------------------------------------------------------------
  worker:
    image: faim-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-worker
    command: ["python", "-m", "orchestration.jobs.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://faim:${POSTGRES_PASSWORD}@postgres:8020/faim_native
      FAIM_AUTO_MIGRATE: "false"
      FAIM_OCR_ENABLED: ${FAIM_OCR_ENABLED:-false}
      FAIM_OCR_ENGINE: ${FAIM_OCR_ENGINE:-tesseract}
      FAIM_OCR_FAIL_CLOSED: ${FAIM_OCR_FAIL_CLOSED:-false}
      FAIM_OCR_LANGS: ${FAIM_OCR_LANGS:-eng}
      FAIM_SELF_INVENT_ENABLED: ${FAIM_SELF_INVENT_ENABLED:-false}
      FAIM_SELF_INVENT_ON_EVOLVE: ${FAIM_SELF_INVENT_ON_EVOLVE:-true}
      FAIM_SELF_INVENT_AFTER_UPLOAD: ${FAIM_SELF_INVENT_AFTER_UPLOAD:-false}
      FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE: ${FAIM_SELF_INVENT_MAX_MACROS_PER_CYCLE:-3}
      FAIM_SELF_INVENT_EVENT_WINDOW: ${FAIM_SELF_INVENT_EVENT_WINDOW:-5000}
      FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT: ${FAIM_SELF_INVENT_MIN_COACTIVATION_COUNT:-3}
      FAIM_SELF_INVENT_LAMBDA_THRESHOLD: ${FAIM_SELF_INVENT_LAMBDA_THRESHOLD:-0.3}
      FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION: ${FAIM_SELF_INVENT_MIN_REDUNDANCY_REDUCTION:-0.01}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import orchestration.jobs.worker; import store.pg.session; print("worker_ok")'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [faim-net]
  # ---------------------------------------------------------------------------
  # FAIM Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    image: faim-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faim-frontend
    env_file: ./frontend/.env
    ports:
      - "8010:8010"
    environment:
      - API_HOST=api:8000
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [faim-net]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  faim-net:
    driver: bridge
