version: "3.8"

services:
  # 1. Database (Postgres 15)
  postgres:
    image: postgres:15
    container_name: faim-postgres
    environment:
      POSTGRES_USER: faim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: faim_native
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faim -d faim_native"]
      interval: 5s
      retries: 5
    networks:
      - faim-net

  # 2. Cache (Redis 7) - For locks & queues
  redis:
    image: redis:7-alpine
    container_name: faim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      retries: 5
    networks:
      - faim-net

  # 3. Vector Store (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faim-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-qdrant_secret}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - faim-net

  # 4. FAIM Native API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-api
    environment:
      - DATABASE_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_native
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-qdrant_secret}
      - FAIM_AUTO_MIGRATE=true
      - FAIM_LOG_LEVEL=INFO
      - TENANT_KEYS_JSON={"default":["test-key"]}
      - ADMIN_KEYS_JSON={"admin":"admin-key"}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - faim-net

  # 5. Background Worker (For Durable Jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faim-worker
    command: ["python", "-m", "orchestration.jobs.worker"]
    environment:
      - DATABASE_URL=postgresql://faim:${POSTGRES_PASSWORD}@postgres:5432/faim_native
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - FAIM_LOG_LEVEL=INFO
    depends_on:
      api:
        condition: service_started
    networks:
      - faim-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  faim-net:
    driver: bridge
