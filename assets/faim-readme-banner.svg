<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1702" height="924" viewBox="0 0 1702 924" role="img" aria-labelledby="title desc">
  <title id="title">FAIM-Native — durable, explainable AI memory graph</title>
  <desc id="desc">A dark sci-fi memory graph with a glowing FAIM mark, data panels, and a professional project title.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020817" stop-opacity="0.98"/>
      <stop offset="0.78" stop-color="#020817" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#22d3ee"/>
      <stop offset="0.72" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="790" height="924" fill="url(#panel)"/>
  <rect x="62" y="64" width="520" height="2" fill="url(#rule)"/>

  <text x="262" y="146" fill="#e7f7ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="2">FAIM</text>
  <text x="264" y="181" fill="#67e8f9" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">NATIVE MEMORY GRAPH</text>

  <text x="70" y="344" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700">Durable memory</text>
  <text x="70" y="398" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700">for explainable AI.</text>
  <text x="72" y="452" fill="#b7c9df" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">Raw evidence → graph evolution →</text>
  <text x="72" y="482" fill="#b7c9df" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">auditable retrieval and agent workflows.</text>

  <g transform="translate(70 560)">
    <rect width="194" height="78" rx="12" fill="#071b35" fill-opacity="0.9" stroke="#1d5f88"/>
    <text x="18" y="30" fill="#67e8f9" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CANONICAL DATA</text>
    <text x="18" y="57" fill="#e0f2fe" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">PostgreSQL truth</text>
  </g>
  <g transform="translate(278 560)">
    <rect width="194" height="78" rx="12" fill="#071b35" fill-opacity="0.9" stroke="#4c3b92"/>
    <text x="18" y="30" fill="#c4b5fd" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">LIVE SURFACES</text>
    <text x="18" y="57" fill="#ede9fe" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">REST · MCP · SSE</text>
  </g>
  <g transform="translate(486 560)">
    <rect width="194" height="78" rx="12" fill="#071b35" fill-opacity="0.9" stroke="#7c3b8e"/>
    <text x="18" y="30" fill="#f0abfc" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">CONTROLLED CHANGE</text>
    <text x="18" y="57" fill="#fce7f3" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">Evolution + audit</text>
  </g>

  <text x="72" y="730" fill="#8fa9c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" letter-spacing="2">DOCKER-BACKED · PREVIEW ALPHA · BENCHMARKABLE</text>
  <rect x="70" y="752" width="612" height="1" fill="url(#rule)"/>
  <text x="72" y="790" fill="#d6e8fa" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">FastAPI · Next.js · PostgreSQL · Redis · Qdrant</text>
</svg>
